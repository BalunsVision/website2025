<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Industrial QC Animation with Gemini API</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000000;
        font-family: Arial, sans-serif;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 16px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="info"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
      // Core Three.js variables
      let scene, camera, renderer, controls, clock;

      // Scene objects
      let conveyorBelt,
        conveyorSupports = [];
      let items = [];
      let inspectionCamera,
        gantry,
        cameraLens,
        redStatusLight,
        greenStatusLight,
        scannerLightEffect,
        cameraMount;
      let controlPanel,
        controlPanelScreen,
        controlPanelCanvas,
        controlPanelCtx,
        controlPanelTexture,
        controlPanelMount;
      let pneumaticActuator, actuatorPiston, collectionBin;

      // Animation parameters
      const BELT_SPEED = 3.0;
      const ITEM_RADIUS = 0.25;
      const ITEM_HEIGHT = 0.8;
      const ITEM_SPACING = ITEM_HEIGHT * 3;
      const CONVEYOR_LENGTH = 15;
      const CONVEYOR_WIDTH = ITEM_RADIUS * 4;
      const CONVEYOR_HEIGHT = 0.2;

      const INSPECTION_POINT_Z = 0;
      const INSPECTION_DURATION = 0.5;
      const ACTUATOR_POINT_Z = -CONVEYOR_LENGTH / 3;
      const PISTON_EXTEND_SPEED = 5;
      const PISTON_RETRACT_SPEED = 5;
      const PISTON_EXTEND_DISTANCE = CONVEYOR_WIDTH * 1.5;

      let nextItemId = 0;
      let lastItemSpawnTime = 0;

      // Colors
      const COLOR_ITEM_DEFAULT = 0x0077ff;
      const COLOR_ITEM_DEFECTIVE = 0xff0000;
      const COLOR_CONVEYOR_SUPPORT = 0xff8800;
      const COLOR_STATUS_GREEN_ON = 0x00ff00;
      const COLOR_STATUS_GREEN_OFF = 0x005500;
      const COLOR_STATUS_RED_ON = 0xff0000;
      const COLOR_STATUS_RED_OFF = 0x550000;
      const COLOR_MOUNT = 0x666666;

      // Gemini API settings
      const GEMINI_API_KEY = '';
      const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;

      init();
      animate();

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        clock = new THREE.Clock();

        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        const cameraX = CONVEYOR_WIDTH * 1.5;
        const cameraY = 5;
        const cameraZ = CONVEYOR_LENGTH / 3;
        camera.position.set(cameraX, cameraY, cameraZ);
        camera.lookAt(0, 0.5, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.5, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
        directionalLight.position.set(5, 10, 7.5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.6);
        pointLight.position.set(0, 3, INSPECTION_POINT_Z);
        scene.add(pointLight);

        createConveyorBelt();
        createInspectionStation();
        createControlPanel();
        createPneumaticActuator();
        createCollectionBin();

        window.addEventListener('resize', onWindowResize, false);
      }

      function createConveyorBelt() {
        const beltGeo = new THREE.BoxGeometry(
          CONVEYOR_WIDTH,
          CONVEYOR_HEIGHT,
          CONVEYOR_LENGTH
        );
        const beltMat = new THREE.MeshStandardMaterial({
          color: 0x333333,
          roughness: 0.8,
        });
        conveyorBelt = new THREE.Mesh(beltGeo, beltMat);
        conveyorBelt.position.y = -CONVEYOR_HEIGHT / 2;
        conveyorBelt.receiveShadow = true;
        scene.add(conveyorBelt);

        const supportGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 16);
        const supportMat = new THREE.MeshStandardMaterial({
          color: COLOR_CONVEYOR_SUPPORT,
          metalness: 0.3,
          roughness: 0.5,
        });
        const numSupports = 5;
        for (let i = 0; i < numSupports; i++) {
          const support = new THREE.Mesh(supportGeo, supportMat);
          const zPos =
            (CONVEYOR_LENGTH / (numSupports - 1)) * i - CONVEYOR_LENGTH / 2;
          support.position.set(
            -CONVEYOR_WIDTH / 2 - 0.1,
            -CONVEYOR_HEIGHT - 0.5,
            zPos
          );
          scene.add(support.clone().translateX(CONVEYOR_WIDTH + 0.2));
          scene.add(support);
          conveyorSupports.push(support);
        }
      }

      function createItem() {
        // Parameters for cylinder geometry, ensure they are accessible if needed by damage function
        const radialSegments = 32;
        const heightSegments = 1; // For a simple cylinder, one segment along height is fine
        const itemGeo = new THREE.CylinderGeometry(
          ITEM_RADIUS,
          ITEM_RADIUS,
          ITEM_HEIGHT,
          radialSegments,
          heightSegments
        );
        const itemMat = new THREE.MeshStandardMaterial({
          color: COLOR_ITEM_DEFAULT,
          metalness: 0.2,
          roughness: 0.4,
        });
        const item = new THREE.Mesh(itemGeo, itemMat);

        item.castShadow = true;
        item.receiveShadow = true;
        item.position.set(
          0,
          ITEM_HEIGHT / 2,
          CONVEYOR_LENGTH / 2 + ITEM_SPACING
        );

        // Store original vertices for potential damage/reset
        item.userData.originalVertices = Array.from(
          item.geometry.attributes.position.array
        );
        // Store geometry parameters for use in damage function
        item.geometry.parameters = {
          radialSegments,
          heightSegments,
          radiusTop: ITEM_RADIUS,
          radiusBottom: ITEM_RADIUS,
          height: ITEM_HEIGHT,
        };

        const itemData = {
          id: nextItemId++,
          mesh: item,
          isDefective: false,
          isVisuallyAltered: false,
          status: 'approaching',
          inspectionTimer: 0,
          actuatorTargetPos: null,
        };
        items.push(itemData);
        scene.add(item);
        return itemData;
      }

      function applyPhysicalDamage(itemData) {
        const mesh = itemData.mesh;
        const geometry = mesh.geometry;
        const positions = geometry.attributes.position.array;
        const originalPositions = mesh.userData.originalVertices;

        if (!originalPositions || !geometry.parameters) {
          console.error(
            'Required data for physical damage not found on item:',
            itemData.id
          );
          return;
        }

        const radialSegments = geometry.parameters.radialSegments;
        const heightSegments = geometry.parameters.heightSegments;
        // Number of vertices in the cylindrical wall part.
        // Side vertices are typically generated first by Three.js CylinderGeometry.
        const numWallVertices = (radialSegments + 1) * (heightSegments + 1);

        const dentCenterWallVertexIndex = Math.floor(
          Math.random() * numWallVertices
        );

        const dentDepth = ITEM_RADIUS * 0.35; // How deep the dent goes
        const dentRadiusSquared = (ITEM_RADIUS * 0.6) ** 2; // Affect vertices within this world-space radius

        const centerOriginalX =
          originalPositions[dentCenterWallVertexIndex * 3];
        const centerOriginalY =
          originalPositions[dentCenterWallVertexIndex * 3 + 1];
        const centerOriginalZ =
          originalPositions[dentCenterWallVertexIndex * 3 + 2];

        for (let i = 0; i < originalPositions.length / 3; i++) {
          const ox = originalPositions[i * 3];
          const oy = originalPositions[i * 3 + 1];
          const oz = originalPositions[i * 3 + 2];

          // Default to original position
          positions[i * 3] = ox;
          positions[i * 3 + 1] = oy;
          positions[i * 3 + 2] = oz;

          // Apply dent only to wall vertices
          if (i < numWallVertices) {
            const distSq =
              (ox - centerOriginalX) ** 2 +
              (oy - centerOriginalY) ** 2 +
              (oz - centerOriginalZ) ** 2;

            if (distSq <= dentRadiusSquared) {
              const direction = new THREE.Vector3(ox, 0, oz).normalize();
              const falloff = Math.max(
                0,
                1 - Math.sqrt(distSq) / Math.sqrt(dentRadiusSquared + 0.0001)
              ); // Add epsilon to avoid div by zero
              const currentDentDepth = dentDepth * falloff;

              positions[i * 3] = ox - direction.x * currentDentDepth;
              // positions[i * 3 + 1] = oy; // Keep Y the same for a side dent
              positions[i * 3 + 2] = oz - direction.z * currentDentDepth;
            }
          }
        }
        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals(); // VERY IMPORTANT for lighting after vertex manipulation
      }

      function removePhysicalDamage(itemData) {
        const mesh = itemData.mesh;
        const geometry = mesh.geometry;
        const positions = geometry.attributes.position.array;
        const originalPositions = mesh.userData.originalVertices;

        if (!originalPositions) return;

        for (let i = 0; i < originalPositions.length / 3; i++) {
          positions[i * 3] = originalPositions[i * 3];
          positions[i * 3 + 1] = originalPositions[i * 3 + 1];
          positions[i * 3 + 2] = originalPositions[i * 3 + 2];
        }
        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals(); // Also recompute normals on reset
      }

      function createInspectionStation() {
        const gantryMaterial = new THREE.MeshStandardMaterial({
          color: 0x777777,
          metalness: 0.8,
          roughness: 0.3,
        });

        const supportGeo = new THREE.BoxGeometry(0.2, 2, 0.2);
        const gantrySupport1 = new THREE.Mesh(supportGeo, gantryMaterial);
        gantrySupport1.position.set(
          -CONVEYOR_WIDTH / 2 - 0.3,
          1,
          INSPECTION_POINT_Z
        );
        gantrySupport1.castShadow = true;
        scene.add(gantrySupport1);

        const gantrySupport2 = new THREE.Mesh(supportGeo, gantryMaterial);
        gantrySupport2.position.set(
          CONVEYOR_WIDTH / 2 + 0.3,
          1,
          INSPECTION_POINT_Z
        );
        gantrySupport2.castShadow = true;
        scene.add(gantrySupport2);

        const crossbarGeo = new THREE.BoxGeometry(
          CONVEYOR_WIDTH + 0.8,
          0.2,
          0.2
        );
        const gantryCrossbar = new THREE.Mesh(crossbarGeo, gantryMaterial);
        gantryCrossbar.position.set(0, 2 + 0.1, INSPECTION_POINT_Z);
        gantryCrossbar.castShadow = true;
        scene.add(gantryCrossbar);

        gantry = new THREE.Group();
        gantry.add(gantrySupport1, gantrySupport2, gantryCrossbar);

        const mountGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.2, 12);
        const mountMat = new THREE.MeshStandardMaterial({
          color: COLOR_MOUNT,
          metalness: 0.6,
          roughness: 0.4,
        });
        cameraMount = new THREE.Mesh(mountGeo, mountMat);
        cameraMount.position.set(0, -0.15, 0);
        gantryCrossbar.add(cameraMount);

        const cameraBodyGeo = new THREE.BoxGeometry(0.5, 0.4, 0.5);
        const cameraBodyMat = new THREE.MeshStandardMaterial({
          color: 0x444444,
          metalness: 0.5,
          roughness: 0.4,
        });
        inspectionCamera = new THREE.Mesh(cameraBodyGeo, cameraBodyMat);
        inspectionCamera.position.set(0, 1.7, INSPECTION_POINT_Z);
        inspectionCamera.castShadow = true;
        scene.add(inspectionCamera);

        const lensGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16);
        const lensMat = new THREE.MeshStandardMaterial({
          color: 0x111111,
          metalness: 0.1,
          roughness: 0.1,
          transparent: true,
          opacity: 0.8,
        });
        cameraLens = new THREE.Mesh(lensGeo, lensMat);
        cameraLens.position.set(0, -0.2, 0);
        cameraLens.rotation.x = Math.PI / 2;
        inspectionCamera.add(cameraLens);

        const lightGeo = new THREE.SphereGeometry(0.05, 16, 16);
        const redLightMat = new THREE.MeshStandardMaterial({
          color: COLOR_STATUS_RED_OFF,
          emissive: COLOR_STATUS_RED_OFF,
          emissiveIntensity: 1,
        });
        redStatusLight = new THREE.Mesh(lightGeo, redLightMat);
        redStatusLight.position.set(-0.15, 0.2, 0);
        inspectionCamera.add(redStatusLight);

        const greenLightMat = new THREE.MeshStandardMaterial({
          color: COLOR_STATUS_GREEN_OFF,
          emissive: COLOR_STATUS_GREEN_OFF,
          emissiveIntensity: 1,
        });
        greenStatusLight = new THREE.Mesh(lightGeo, greenLightMat);
        greenStatusLight.position.set(0.15, 0.2, 0);
        inspectionCamera.add(greenStatusLight);

        const scannerLightGeo = new THREE.PlaneGeometry(
          CONVEYOR_WIDTH * 0.8,
          0.05
        );
        const scannerLightMat = new THREE.MeshBasicMaterial({
          color: 0x00ffff,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide,
        });
        scannerLightEffect = new THREE.Mesh(scannerLightGeo, scannerLightMat);
        scannerLightEffect.position.set(
          0,
          ITEM_HEIGHT + 0.1,
          INSPECTION_POINT_Z
        );
        scannerLightEffect.rotation.x = -Math.PI / 2;
        scene.add(scannerLightEffect);
      }

      function createControlPanel() {
        const panelBoxWidth = 1.2;
        const panelBoxHeight = 1.4;
        const panelBoxDepth = 0.3;
        const panelBoxGeo = new THREE.BoxGeometry(
          panelBoxWidth,
          panelBoxHeight,
          panelBoxDepth
        );
        const panelBoxMat = new THREE.MeshStandardMaterial({
          color: 0x555555,
          metalness: 0.7,
          roughness: 0.4,
        });

        const panelXPosition = CONVEYOR_WIDTH / 2 + panelBoxWidth / 2 + 0.7;
        const panelYPosition = 1.3;
        const panelZPosition = INSPECTION_POINT_Z + 0.8;

        controlPanel = new THREE.Mesh(panelBoxGeo, panelBoxMat);
        controlPanel.position.set(
          panelXPosition,
          panelYPosition,
          panelZPosition
        );

        const dx = camera.position.x - panelXPosition;
        const dz = camera.position.z - panelZPosition;
        controlPanel.rotation.y = Math.atan2(dx, dz);

        controlPanel.castShadow = true;
        scene.add(controlPanel);

        const mountPostHeight = panelYPosition - panelBoxHeight / 2;
        const mountPostGeo = new THREE.CylinderGeometry(
          0.08,
          0.08,
          mountPostHeight,
          16
        );
        const mountPostMat = new THREE.MeshStandardMaterial({
          color: COLOR_MOUNT,
          metalness: 0.6,
          roughness: 0.4,
        });
        controlPanelMount = new THREE.Mesh(mountPostGeo, mountPostMat);
        controlPanelMount.position.set(
          panelXPosition,
          mountPostHeight / 2,
          panelZPosition
        );
        controlPanelMount.castShadow = true;
        scene.add(controlPanelMount);

        controlPanelCanvas = document.createElement('canvas');
        controlPanelCanvas.width = 320;
        controlPanelCanvas.height = 320;
        controlPanelCtx = controlPanelCanvas.getContext('2d');

        controlPanelTexture = new THREE.CanvasTexture(controlPanelCanvas);
        controlPanelTexture.magFilter = THREE.NearestFilter;
        controlPanelTexture.minFilter = THREE.NearestFilter;

        const screenWidth = 1.1;
        const screenHeight = 1.1;
        const screenGeo = new THREE.PlaneGeometry(screenWidth, screenHeight);
        const screenMat = new THREE.MeshStandardMaterial({
          map: controlPanelTexture,
          emissive: 0x333333,
          emissiveMap: controlPanelTexture,
          emissiveIntensity: 0.5,
        });
        controlPanelScreen = new THREE.Mesh(screenGeo, screenMat);
        controlPanelScreen.position.set(0, 0.05, panelBoxDepth / 2 + 0.005);
        controlPanel.add(controlPanelScreen);

        updateControlPanel('STANDBY', 'grey', '');
      }

      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = context.measureText(testLine);
          const testWidth = metrics.width;
          if (testWidth > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, y);
      }

      async function fetchDefectAnalysisFromLLM() {
        const prompt =
          "A blue cylindrical item on a conveyor belt has been identified as defective by an inspection camera. Provide a very brief, fictional, one-sentence technical-sounding analysis of the potential defect. Examples: 'Dimensional inconsistency detected on axis B.' or 'Surface anomaly exceeds tolerance limits.' or 'Material composition variance suspected.'";

        let chatHistory = [{ role: 'user', parts: [{ text: prompt }] }];
        const payload = { contents: chatHistory };

        try {
          const response = await fetch(GEMINI_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            console.error(
              'Gemini API Error:',
              response.status,
              await response.text()
            );
            return 'Error: Could not fetch analysis.';
          }

          const result = await response.json();

          if (
            result.candidates &&
            result.candidates.length > 0 &&
            result.candidates[0].content &&
            result.candidates[0].content.parts &&
            result.candidates[0].content.parts.length > 0
          ) {
            return result.candidates[0].content.parts[0].text;
          } else {
            console.error('Unexpected Gemini API response structure:', result);
            return 'Analysis unavailable (empty response).';
          }
        } catch (error) {
          console.error('Error calling Gemini API:', error);
          return 'Analysis unavailable (network/API error).';
        }
      }

      function updateControlPanel(
        statusText,
        itemVisualColor,
        defectAnalysisText = ''
      ) {
        controlPanelCtx.fillStyle = '#101820';
        controlPanelCtx.fillRect(
          0,
          0,
          controlPanelCanvas.width,
          controlPanelCanvas.height
        );

        controlPanelCtx.font = 'bold 32px Arial';
        controlPanelCtx.textAlign = 'center';
        controlPanelCtx.fillStyle = '#00ddff';
        controlPanelCtx.fillText(statusText, controlPanelCanvas.width / 2, 50);

        const R = 40;
        const H = 80;
        const X = controlPanelCanvas.width / 2;
        const Y = controlPanelCanvas.height / 2 - 30;

        controlPanelCtx.fillStyle = itemVisualColor;
        controlPanelCtx.fillRect(X - R, Y - H / 2, R * 2, H);
        controlPanelCtx.beginPath();
        controlPanelCtx.ellipse(X, Y - H / 2, R, R * 0.3, 0, 0, 2 * Math.PI);
        controlPanelCtx.fill();

        const darkerColor = new THREE.Color(itemVisualColor)
          .multiplyScalar(0.7)
          .getStyle();
        controlPanelCtx.fillStyle = darkerColor;
        controlPanelCtx.beginPath();
        controlPanelCtx.ellipse(X, Y + H / 2, R, R * 0.3, 0, 0, 2 * Math.PI);
        controlPanelCtx.fill();

        if (defectAnalysisText) {
          controlPanelCtx.font = '20px Arial';
          controlPanelCtx.fillStyle = '#ffff00';
          controlPanelCtx.textAlign = 'center';
          wrapText(
            controlPanelCtx,
            defectAnalysisText,
            controlPanelCanvas.width / 2,
            Y + H / 2 + 40,
            controlPanelCanvas.width - 30,
            24
          );
        }

        controlPanelTexture.needsUpdate = true;
      }

      function createPneumaticActuator() {
        const actuatorYPos = ITEM_HEIGHT / 2;
        const actuatorEdgeX = CONVEYOR_WIDTH / 2 + 0.05;
        const cylinderBodyLength = 0.8;

        pneumaticActuator = new THREE.Group();
        pneumaticActuator.position.set(
          actuatorEdgeX + cylinderBodyLength / 2,
          actuatorYPos,
          ACTUATOR_POINT_Z
        );
        pneumaticActuator.rotation.z = Math.PI / 2;
        scene.add(pneumaticActuator);

        const cylinderGeo = new THREE.CylinderGeometry(
          0.15,
          0.15,
          cylinderBodyLength,
          16
        );
        const cylinderMat = new THREE.MeshStandardMaterial({
          color: 0x888888,
          metalness: 0.9,
          roughness: 0.2,
        });
        const pneumaticActuatorCylinder = new THREE.Mesh(
          cylinderGeo,
          cylinderMat
        );
        pneumaticActuatorCylinder.castShadow = true;
        pneumaticActuator.add(pneumaticActuatorCylinder);

        const pistonActualLength = PISTON_EXTEND_DISTANCE * 1.2;
        const pistonGeo = new THREE.CylinderGeometry(
          0.08,
          0.08,
          pistonActualLength,
          16
        );
        const pistonMat = new THREE.MeshStandardMaterial({
          color: 0xbbbbbb,
          metalness: 1.0,
          roughness: 0.1,
        });
        actuatorPiston = new THREE.Mesh(pistonGeo, pistonMat);
        actuatorPiston.castShadow = true;

        actuatorPiston.userData.retractedY =
          cylinderBodyLength / 2 - pistonActualLength / 2;
        actuatorPiston.userData.extendedY =
          actuatorPiston.userData.retractedY + PISTON_EXTEND_DISTANCE;

        actuatorPiston.position.y = actuatorPiston.userData.retractedY;
        actuatorPiston.userData.isExtended = false;
        actuatorPiston.userData.isMoving = false;

        pneumaticActuatorCylinder.add(actuatorPiston);
      }

      function createCollectionBin() {
        const binWidth = CONVEYOR_WIDTH * 1.5;
        const binHeight = 1.0;
        const binDepth = CONVEYOR_WIDTH * 1.5;
        const binThickness = 0.1;
        const binMaterial = new THREE.MeshStandardMaterial({
          color: 0x666666,
          metalness: 0.5,
          roughness: 0.6,
          side: THREE.DoubleSide,
        });

        collectionBin = new THREE.Group();
        const conveyorEdgeForBin = CONVEYOR_WIDTH / 2 + 0.1;
        const binCenterX =
          conveyorEdgeForBin + PISTON_EXTEND_DISTANCE / 2 + binWidth / 2;
        collectionBin.position.set(binCenterX, 0, ACTUATOR_POINT_Z);
        scene.add(collectionBin);

        const floorGeo = new THREE.BoxGeometry(
          binWidth,
          binThickness,
          binDepth
        );
        const floor = new THREE.Mesh(floorGeo, binMaterial);
        floor.position.y = -binHeight / 2 + binThickness / 2;
        floor.receiveShadow = true;
        collectionBin.add(floor);

        const wallHeight = binHeight;
        const sideWallGeo = new THREE.BoxGeometry(
          binThickness,
          wallHeight,
          binDepth
        );
        const endWallGeo = new THREE.BoxGeometry(
          binWidth - 2 * binThickness,
          wallHeight,
          binThickness
        );

        const wallData = [
          { geo: sideWallGeo, x: -binWidth / 2 + binThickness / 2, y: 0, z: 0 },
          { geo: sideWallGeo, x: binWidth / 2 - binThickness / 2, y: 0, z: 0 },
          { geo: endWallGeo, x: 0, y: 0, z: -binDepth / 2 + binThickness / 2 },
          { geo: endWallGeo, x: 0, y: 0, z: binDepth / 2 - binThickness / 2 },
        ];

        wallData.forEach((data) => {
          const wall = new THREE.Mesh(data.geo, binMaterial);
          wall.position.set(data.x, data.y, data.z);
          wall.castShadow = true;
          collectionBin.add(wall);
        });
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animateScannerEffect(on) {
        if (on) {
          scannerLightEffect.material.opacity = 0.5;
          setTimeout(() => {
            if (scannerLightEffect) scannerLightEffect.material.opacity = 0;
          }, 100);
        } else {
          if (scannerLightEffect) scannerLightEffect.material.opacity = 0;
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const elapsedTime = clock.getElapsedTime();

        if (elapsedTime - lastItemSpawnTime > ITEM_SPACING / BELT_SPEED) {
          if (items.length < 15) {
            createItem();
          }
          lastItemSpawnTime = elapsedTime;
        }

        for (let i = items.length - 1; i >= 0; i--) {
          const itemData = items[i];
          const item = itemData.mesh;

          if (itemData.status === 'rejecting') {
            if (itemData.actuatorTargetPos) {
              const rejectSpeed = BELT_SPEED * 2;
              item.position.lerp(
                itemData.actuatorTargetPos,
                rejectSpeed * delta
              );
              if (item.position.distanceTo(itemData.actuatorTargetPos) < 0.1) {
                itemData.status = 'rejected';
                item.position.y -= 0.2;
              }
            }
          } else if (
            itemData.status !== 'rejected' &&
            itemData.status !== 'passed'
          ) {
            item.position.z -= BELT_SPEED * delta;

            if (
              item.position.z < INSPECTION_POINT_Z + ITEM_HEIGHT / 2 &&
              item.position.z > INSPECTION_POINT_Z - ITEM_HEIGHT / 2 &&
              itemData.status === 'approaching'
            ) {
              itemData.status = 'inspecting';
              itemData.inspectionTimer = INSPECTION_DURATION;
              updateControlPanel('INSPECTING', 'gray', '');
              animateScannerEffect(true);
              redStatusLight.material.color.setHex(COLOR_STATUS_RED_OFF);
              redStatusLight.material.emissive.setHex(COLOR_STATUS_RED_OFF);
              greenStatusLight.material.color.setHex(COLOR_STATUS_GREEN_OFF);
              greenStatusLight.material.emissive.setHex(COLOR_STATUS_GREEN_OFF);

              // If item was visually altered, reset it now that it's re-entering inspection
              if (itemData.isVisuallyAltered) {
                item.material.color.setHex(COLOR_ITEM_DEFAULT); // Should be default before inspection
                item.scale.set(1, 1, 1);
                item.rotation.set(0, 0, 0);
                removePhysicalDamage(itemData);
                itemData.isVisuallyAltered = false;
              }
            }

            if (itemData.status === 'inspecting') {
              itemData.inspectionTimer -= delta;
              if (itemData.inspectionTimer <= 0) {
                itemData.status = 'post_inspection';
                // const wasPreviouslyDefective = itemData.isDefective; // Not needed with current one-shot logic
                itemData.isDefective = Math.random() < 0.25;

                if (itemData.isDefective) {
                  if (!itemData.isVisuallyAltered) {
                    // Apply all visual defects only once
                    item.material.color.setHex(COLOR_ITEM_DEFECTIVE);
                    item.scale.set(0.95, 0.9, 0.95);
                    item.rotation.x = (Math.random() - 0.5) * 0.2;
                    item.rotation.z = (Math.random() - 0.5) * 0.2;
                    applyPhysicalDamage(itemData);
                    itemData.isVisuallyAltered = true;
                  }

                  updateControlPanel(
                    'DEFECTIVE',
                    'red',
                    '✨ ANALYZING DEFECT...'
                  );
                  redStatusLight.material.color.setHex(COLOR_STATUS_RED_ON);
                  redStatusLight.material.emissive.setHex(COLOR_STATUS_RED_ON);
                  greenStatusLight.material.color.setHex(
                    COLOR_STATUS_GREEN_OFF
                  );
                  greenStatusLight.material.emissive.setHex(
                    COLOR_STATUS_GREEN_OFF
                  );

                  fetchDefectAnalysisFromLLM().then((analysis) => {
                    const currentPanelText =
                      controlPanel.userData.currentAnalysisText || '';
                    if (
                      controlPanelCtx.fillStyle.toLowerCase().includes('red') &&
                      currentPanelText.includes('ANALYZING')
                    ) {
                      updateControlPanel('DEFECTIVE', 'red', analysis);
                      controlPanel.userData.currentAnalysisText = analysis;
                    }
                  });
                  controlPanel.userData.currentAnalysisText =
                    '✨ ANALYZING DEFECT...';
                } else {
                  // Item is OK
                  if (itemData.isVisuallyAltered) {
                    // If it was visually altered, reset it
                    item.material.color.setHex(COLOR_ITEM_DEFAULT);
                    item.scale.set(1, 1, 1);
                    item.rotation.set(0, 0, 0);
                    removePhysicalDamage(itemData);
                    itemData.isVisuallyAltered = false;
                  } else {
                    // Ensure it's default blue if it was never altered
                    item.material.color.setHex(COLOR_ITEM_DEFAULT);
                  }
                  updateControlPanel('OK', 'blue', '');
                  controlPanel.userData.currentAnalysisText = '';
                  redStatusLight.material.color.setHex(COLOR_STATUS_RED_OFF);
                  redStatusLight.material.emissive.setHex(COLOR_STATUS_RED_OFF);
                  greenStatusLight.material.color.setHex(COLOR_STATUS_GREEN_ON);
                  greenStatusLight.material.emissive.setHex(
                    COLOR_STATUS_GREEN_ON
                  );
                }
                animateScannerEffect(false);
              }
            }

            if (
              itemData.isDefective &&
              itemData.status === 'post_inspection' &&
              item.position.z < ACTUATOR_POINT_Z + ITEM_HEIGHT / 4 &&
              item.position.z > ACTUATOR_POINT_Z - ITEM_HEIGHT / 4 &&
              actuatorPiston &&
              !actuatorPiston.userData.isMoving
            ) {
              itemData.status = 'rejecting';
              actuatorPiston.userData.isMoving = true;
              actuatorPiston.userData.isExtended = true;
              itemData.actuatorTargetPos = new THREE.Vector3(
                item.position.x + PISTON_EXTEND_DISTANCE * 1.1,
                item.position.y,
                item.position.z
              );
            }
          }

          if (
            item.position.z < -CONVEYOR_LENGTH / 2 - ITEM_SPACING * 2 &&
            itemData.status !== 'rejected'
          ) {
            itemData.status = 'passed';
          }

          const removalThresholdX =
            CONVEYOR_WIDTH / 2 + PISTON_EXTEND_DISTANCE * 1.0;
          if (
            (itemData.status === 'rejected' &&
              item.position.x > removalThresholdX) ||
            (itemData.status === 'passed' &&
              item.position.z < -CONVEYOR_LENGTH * 0.6)
          ) {
            scene.remove(item);
            item.geometry.dispose(); // Dispose geometry
            item.material.dispose(); // Dispose material
            items.splice(i, 1);
          }
        }

        if (actuatorPiston && actuatorPiston.userData.isMoving) {
          const targetY = actuatorPiston.userData.isExtended
            ? actuatorPiston.userData.extendedY
            : actuatorPiston.userData.retractedY;

          const speed = actuatorPiston.userData.isExtended
            ? PISTON_EXTEND_SPEED
            : PISTON_RETRACT_SPEED;

          if (actuatorPiston.userData.isExtended) {
            actuatorPiston.position.y += speed * delta;
            if (actuatorPiston.position.y >= targetY) {
              actuatorPiston.position.y = targetY;
              actuatorPiston.userData.isMoving = false;
              setTimeout(() => {
                if (actuatorPiston) {
                  actuatorPiston.userData.isMoving = true;
                  actuatorPiston.userData.isExtended = false;
                }
              }, 200);
            }
          } else {
            actuatorPiston.position.y -= speed * delta;
            if (actuatorPiston.position.y <= targetY) {
              actuatorPiston.position.y = targetY;
              actuatorPiston.userData.isMoving = false;
            }
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }
    </script>
  </body>
