<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Capsule Inspection Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        canvas {
            display: block;
        }
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #info-panel h1 {
            margin: 0 0 10px 0;
            font-size: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
        }
        #info-panel p {
            margin: 5px 0;
        }
        .key {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .bad { background-color: #dc3545; }
        .pending { background-color: #007bff; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>



    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // --- SIMULATION PARAMETERS ---
        const CONVEYOR_WIDTH = 6;
        const CAPSULE_RADIUS = 0.07;
        const CAPSULE_LENGTH = 0.14;
        const CONVEYOR_THICKNESS = 0.1;
        const INSPECTION_AREA_LENGTH = 5.0;
        const STROBE_ON_INTENSITY = 15.0;

        // --- BASIC SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(-10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        scene.add(directionalLight);

        // --- MATERIALS ---
        const conveyorMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.4 });
        const railMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.3 });
        const supportMaterial = new THREE.MeshStandardMaterial({ color: 0xCD7F32, metalness: 0.8, roughness: 0.4 });
        const cameraMountMaterial = new THREE.MeshStandardMaterial({ color: 0x474B4E, metalness: 0.8, roughness: 0.5 });
        
        const badCapsuleMaterial = new THREE.MeshStandardMaterial({ color: 0xdc3545, metalness: 0.3, roughness: 0.5 });
        
        const colorPalette = [0xffa500, 0x007bff, 0x8B4513, 0x228B22];
        const randomColorHex = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        const initialMaterial = new THREE.MeshStandardMaterial({ color: randomColorHex, metalness: 0.3, roughness: 0.5 });

        const lightBoxMaterial = new THREE.MeshStandardMaterial({
            color: 0x000000,
            emissive: 0x000000,
            emissiveIntensity: 1
        });

        // --- GEOMETRY ---
        const capsuleGeometry = new THREE.CapsuleGeometry(CAPSULE_RADIUS, CAPSULE_LENGTH, 4, 16);

        // --- SCENE OBJECTS ---
        
        const chuteAngle = -Math.PI / 10;
        const mainChute = new THREE.Group();
        const conveyorLength = 30;
        const segmentLength = (conveyorLength - INSPECTION_AREA_LENGTH) / 2;

        const chuteBase1 = new THREE.Mesh(new THREE.BoxGeometry(CONVEYOR_WIDTH, CONVEYOR_THICKNESS, segmentLength), conveyorMaterial);
        chuteBase1.position.z = (conveyorLength / 2) - (segmentLength / 2);
        chuteBase1.receiveShadow = true;
        mainChute.add(chuteBase1);

        const chuteBase2 = new THREE.Mesh(new THREE.BoxGeometry(CONVEYOR_WIDTH, CONVEYOR_THICKNESS, segmentLength), conveyorMaterial);
        chuteBase2.position.z = -(conveyorLength / 2) + (segmentLength / 2);
        chuteBase2.receiveShadow = true;
        mainChute.add(chuteBase2);

        const lightBox = new THREE.Mesh(new THREE.BoxGeometry(CONVEYOR_WIDTH, CONVEYOR_THICKNESS * 0.9, INSPECTION_AREA_LENGTH), lightBoxMaterial);
        lightBox.position.z = 0;
        mainChute.add(lightBox);

        const railHeight = 0.5;
        const railLeft1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, railHeight, segmentLength), railMaterial);
        railLeft1.position.set(-(CONVEYOR_WIDTH / 2 + 0.1), railHeight/2, chuteBase1.position.z);
        mainChute.add(railLeft1);
        const railLeft2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, railHeight, segmentLength), railMaterial);
        railLeft2.position.set(-(CONVEYOR_WIDTH / 2 + 0.1), railHeight/2, chuteBase2.position.z);
        mainChute.add(railLeft2);
        
        const railRight1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, railHeight, segmentLength), railMaterial);
        railRight1.position.set(CONVEYOR_WIDTH / 2 + 0.1, railHeight/2, chuteBase1.position.z);
        mainChute.add(railRight1);
        const railRight2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, railHeight, segmentLength), railMaterial);
        railRight2.position.set(CONVEYOR_WIDTH / 2 + 0.1, railHeight/2, chuteBase2.position.z);
        mainChute.add(railRight2);

        mainChute.rotation.x = chuteAngle;
        mainChute.position.y = 5;
        scene.add(mainChute);

        // Inspection Camera
        const cameraSystem = new THREE.Group();
        const cameraBody = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1), new THREE.MeshStandardMaterial({color: 0xffa500}));
        const cameraLens = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 32), new THREE.MeshStandardMaterial({color: 0x333333}));
        cameraLens.rotation.x = Math.PI / 2;
        cameraLens.position.z = 0.5;
        cameraSystem.add(cameraBody);
        cameraSystem.add(cameraLens);
        
        cameraSystem.position.set(0, 13, 0);
        cameraSystem.rotation.x = -Math.PI / 2;
        cameraSystem.rotation.y = Math.PI;
        cameraSystem.scale.set(1.3, 1.3, 1.3);
        scene.add(cameraSystem);
        
        // Add Baluns Logo
        const fontLoader = new FontLoader();
        fontLoader.load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json', (font) => {
            const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const textGeometry = new TextGeometry('Baluns', {
                font: font,
                size: 0.25,
                height: 0.05,
            });
            textGeometry.center();

            // Logo for the right side (+x)
            const logo1 = new THREE.Mesh(textGeometry, textMaterial);
            logo1.position.set(1.05, 0, 0);
            logo1.rotation.y = Math.PI / 2;
            cameraBody.add(logo1);

            // Logo for the left side (-x)
            const logo2 = new THREE.Mesh(textGeometry.clone(), textMaterial.clone());
            logo2.position.set(-1.05, 0, 0);
            logo2.rotation.y = -Math.PI / 2;
            cameraBody.add(logo2);
        });

        // Camera Mount
        const mountHeight = 12.3;
        const cameraMount = new THREE.Group();
        const verticalPost = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, mountHeight, 0.5),
            cameraMountMaterial
        );
        verticalPost.castShadow = true;
        verticalPost.position.set((CONVEYOR_WIDTH / 2) + 0.8, mountHeight / 2, 0);
        
        const horizontalArm = new THREE.Mesh(
            new THREE.BoxGeometry(4.3, 0.5, 0.5),
            cameraMountMaterial
        );
        horizontalArm.castShadow = true;
        horizontalArm.position.set(verticalPost.position.x - (4.3 / 2), mountHeight, 0);
        
        cameraMount.add(verticalPost);
        cameraMount.add(horizontalArm);
        scene.add(cameraMount);

        // Ground mount fixtures
        function createSupportLeg(worldX, worldZ, height) {
            const leg = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, height, 0.5),
                supportMaterial
            );
            leg.position.set(worldX, height / 2, worldZ);
            leg.castShadow = true;
            scene.add(leg);
        }

        mainChute.updateMatrixWorld();

        const legPositionsLocal = [
            new THREE.Vector3(CONVEYOR_WIDTH / 2, -CONVEYOR_THICKNESS / 2, conveyorLength / 2 - 3),
            new THREE.Vector3(-CONVEYOR_WIDTH / 2, -CONVEYOR_THICKNESS / 2, conveyorLength / 2 - 3),
            new THREE.Vector3(CONVEYOR_WIDTH / 2, -CONVEYOR_THICKNESS / 2, -conveyorLength / 2 + 3),
            new THREE.Vector3(-CONVEYOR_WIDTH / 2, -CONVEYOR_THICKNESS / 2, -conveyorLength / 2 + 3),
            new THREE.Vector3(CONVEYOR_WIDTH / 2, -CONVEYOR_THICKNESS / 2, INSPECTION_AREA_LENGTH / 2),
            new THREE.Vector3(-CONVEYOR_WIDTH / 2, -CONVEYOR_THICKNESS / 2, INSPECTION_AREA_LENGTH / 2),
        ];

        legPositionsLocal.forEach(pos => {
            const worldPos = pos.clone().applyMatrix4(mainChute.matrixWorld);
            createSupportLeg(worldPos.x, worldPos.z, worldPos.y);
        });

        const binPosition = new THREE.Vector3(0, 0, -17);
        const binWidth = CONVEYOR_WIDTH * 1.5;
        const binFloorY = 0.1;

        function createBin(position, color) {
            const bin = new THREE.Group();
            const wallMaterial = new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            const floor = new THREE.Mesh(new THREE.BoxGeometry(binWidth, 0.2, binWidth), wallMaterial);
            floor.receiveShadow = true;
            
            const wall1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, binWidth), wallMaterial);
            wall1.position.set(-(binWidth/2 + 0.1), 1.5, 0);
            const wall2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, binWidth), wallMaterial);
            wall2.position.set(binWidth/2 + 0.1, 1.5, 0);
            const wall3 = new THREE.Mesh(new THREE.BoxGeometry(binWidth + 0.4, 3, 0.2), wallMaterial);
            wall3.position.set(0, 1.5, -(binWidth/2 + 0.1));
            const wall4 = new THREE.Mesh(new THREE.BoxGeometry(binWidth + 0.4, 3, 0.2), wallMaterial);
            wall4.position.set(0, 1.5, (binWidth/2 + 0.1));
            
            bin.add(floor, wall1, wall2, wall3, wall4);
            bin.position.copy(position);
            scene.add(bin);
        }
        createBin(binPosition, 0xadd8e6);

        // --- SIMULATION LOGIC ---
        let capsules = [];
        let settledCapsules = [];
        const MAX_SETTLED_CAPSULES = 500;
        let frameCount = 0;
        const generationInterval = 1;
        const chuteTopZ = conveyorLength / 2 - 1;
        const inspectionZ = 0;
        const endOfChuteZ = -conveyorLength / 2;
        const speed = 0.04;
        
        let lastToggleTime = 0;
        let isBacklightOn = false;
        const strobeInterval = 500;

        // Set new default camera position and target
        camera.position.set(12, 15, 20); // Fixed starting camera position
        controls.target.set(0, 3, 0);    // Fixed starting camera target

        function createCapsule() {
            const capsuleMesh = new THREE.Mesh(capsuleGeometry, initialMaterial.clone());
            capsuleMesh.castShadow = true;
            capsuleMesh.rotation.z = Math.PI / 2;
            
            const xPos = (Math.random() - 0.5) * (CONVEYOR_WIDTH - 1); 
            const yPos = (CONVEYOR_THICKNESS / 2) + CAPSULE_RADIUS;
            capsuleMesh.position.set(xPos, yPos, chuteTopZ);

            const capsuleObject = {
                mesh: capsuleMesh,
                isDefective: Math.random() < 0.2,
                inspected: false,
                falling: false,
                settled: false,
            };
            
            mainChute.add(capsuleMesh);
            capsules.push(capsuleObject);
        }

        const pendingKeySpan = document.getElementById('pending-key');
        if (pendingKeySpan) {
            pendingKeySpan.style.backgroundColor = `#${randomColorHex.toString(16).padStart(6, '0')}`;
        }

        function animate() {
            requestAnimationFrame(animate);
            frameCount++;

            const currentTime = Date.now();
            if (currentTime - lastToggleTime > strobeInterval) {
                isBacklightOn = !isBacklightOn;
                if (isBacklightOn) {
                    lightBoxMaterial.color.setHex(0xffffff);
                    lightBoxMaterial.emissive.setHex(0xffffff);
                    lightBoxMaterial.emissiveIntensity = STROBE_ON_INTENSITY;
                } else {
                    lightBoxMaterial.color.setHex(0x000000);
                    lightBoxMaterial.emissive.setHex(0x000000);
                }
                lastToggleTime = currentTime;
            }

            if (frameCount % generationInterval === 0) {
                createCapsule();
            }

            for (let i = capsules.length - 1; i >= 0; i--) {
                const capsule = capsules[i];
                const mesh = capsule.mesh;

                if (capsule.settled) {
                    continue;
                }

                if (capsule.falling) {
                    if (mesh.position.y > binFloorY + CAPSULE_RADIUS) {
                         mesh.position.y -= 0.1;
                    } else {
                        capsule.falling = false;
                        capsule.settled = true;
                        mesh.position.y = binFloorY + CAPSULE_RADIUS + (Math.random() * CAPSULE_RADIUS * 4);
                        mesh.position.x = binPosition.x + (Math.random() - 0.5) * (binWidth * 0.9);
                        mesh.position.z = binPosition.z + (Math.random() - 0.5) * (binWidth * 0.9);
                        mesh.rotation.y = Math.random() * Math.PI * 2;
                        settledCapsules.push(capsule);
                    }
                } else {
                    mesh.rotation.x += speed * 2.5;
                    mesh.position.z -= speed;

                    if (!capsule.inspected && mesh.position.z <= inspectionZ + (INSPECTION_AREA_LENGTH / 2) && mesh.position.z >= inspectionZ - (INSPECTION_AREA_LENGTH / 2)) {
                        capsule.inspected = true;
                        if (capsule.isDefective) {
                            mesh.material = badCapsuleMaterial;
                        } 
                    }

                    if (mesh.position.z <= endOfChuteZ) {
                        capsule.falling = true;
                        
                        const worldPosition = new THREE.Vector3();
                        mesh.getWorldPosition(worldPosition);
                        mainChute.remove(mesh);
                        scene.add(mesh);
                        mesh.position.copy(worldPosition);
                    }
                }

                if (mesh.position.y < -10) {
                    scene.remove(mesh);
                    mesh.geometry.dispose();
                    mesh.material.dispose();
                    capsules.splice(i, 1);
                }
            }
            
            while (settledCapsules.length > MAX_SETTLED_CAPSULES) {
                const oldestCapsule = settledCapsules.shift();
                const oldestMesh = oldestCapsule.mesh;
                
                const indexInMainArray = capsules.findIndex(c => c === oldestCapsule);
                if (indexInMainArray > -1) {
                    capsules.splice(indexInMainArray, 1);
                }

                scene.remove(oldestMesh);
                oldestMesh.geometry.dispose();
                oldestMesh.material.dispose();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

        animate();

    </script>
</body>
</html>
