<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Conveyor Inspection Animation with Repositioned TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        /* infoPanel CSS is removed as the element is removed */
        #canvasContainer {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <div id="canvasContainer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script type="module">
        // --- Global Variables ---
        let scene, camera, renderer, controls;
        let conveyorBelt, inspectionStation, rejectionArm, collectionBin, tvDisplay, tvMount;
        const batteries = [];
        let batteryIdCounter = 0;
        const conveyorSpeed = 0.05;
        const batterySpawnInterval = 80; 
        let frameCount = 0;

        let tvCanvas, tvContext, tvTexture;
        let logoCanvas, logoContext, logoTexture; 
        let labelCanvas, labelContext, labelTexture; 
        const CHANCE_OF_MISSING_LABEL = 0.15; 

        let greenLed, redLed; 
        const LED_ON_COLOR_GREEN = new THREE.Color(0x00ff00);
        const LED_ON_COLOR_RED = new THREE.Color(0xff0000);
        const LED_OFF_COLOR = new THREE.Color(0x333333); 
        let ledTimer = 0;
        const LED_DURATION = 30; 

        // --- Initialization ---
        function init() {
            try {
                // Scene
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xcccccc); 

                // Camera
                camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(10, 12, 15); 
                camera.lookAt(0, 1, 0); 

                // Renderer
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true; 
                document.getElementById('canvasContainer').appendChild(renderer.domElement);

                // Controls
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.screenSpacePanning = false;
                controls.minDistance = 5;
                controls.maxDistance = 50;
                controls.target.set(0,1,0); 
                controls.maxPolarAngle = Math.PI / 2 - 0.05; 

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 7.5);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 1024;
                directionalLight.shadow.mapSize.height = 1024;
                scene.add(directionalLight);

                // Ground plane
                const groundGeometry = new THREE.PlaneGeometry(50, 50);
                const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x999999, side: THREE.DoubleSide });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -0.5; 
                ground.receiveShadow = true;
                scene.add(ground);
                
                createConveyorSystem();
                initTvDisplayCanvas(); 
                initCameraLogoCanvas(); 
                initLabelTexture(); 

                updateTvScreen("System Standby", "", "Awaiting Battery...");
                animate();
            } catch (error) {
                console.error("Error during initialization:", error);
                const errorDiv = document.createElement('div');
                errorDiv.style.position = 'absolute';
                errorDiv.style.top = '50%';
                errorDiv.style.left = '50%';
                errorDiv.style.transform = 'translate(-50%, -50%)';
                errorDiv.style.padding = '20px';
                errorDiv.style.backgroundColor = 'red';
                errorDiv.style.color = 'white';
                errorDiv.textContent = 'An error occurred. Please check the console for details.';
                document.body.appendChild(errorDiv);
            }
        }

        // --- Initialize TV Display Canvas and Texture ---
        function initTvDisplayCanvas() {
            tvCanvas = document.createElement('canvas');
            const tvScreenWidthPixels = 512; 
            const tvScreenHeightPixels = 256; 
            tvCanvas.width = tvScreenWidthPixels;
            tvCanvas.height = tvScreenHeightPixels;
            tvContext = tvCanvas.getContext('2d');

            tvTexture = new THREE.CanvasTexture(tvCanvas);
            tvTexture.minFilter = THREE.LinearFilter;
            tvTexture.magFilter = THREE.LinearFilter;

            if (tvDisplay) { 
                tvDisplay.material.map = tvTexture;
                tvDisplay.material.needsUpdate = true;
            }
        }

        // --- Initialize Camera Logo Canvas and Texture ---
        function initCameraLogoCanvas() {
            logoCanvas = document.createElement('canvas');
            const logoWidthPixels = 256; 
            const logoHeightPixels = 128; 
            logoCanvas.width = logoWidthPixels;
            logoCanvas.height = logoHeightPixels;
            logoContext = logoCanvas.getContext('2d');

            logoContext.fillStyle = '#FFFFFF'; 
            logoContext.fillRect(0, 0, logoCanvas.width, logoCanvas.height);
            
            logoContext.fillStyle = '#FFA500'; 
            logoContext.font = 'bold 60px Arial';
            logoContext.textAlign = 'center';
            logoContext.textBaseline = 'middle';
            logoContext.fillText("BLNS", logoCanvas.width / 2, logoCanvas.height / 2); 
            
            logoContext.strokeStyle = '#333333';
            logoContext.lineWidth = 4;
            logoContext.strokeRect(0,0, logoCanvas.width, logoCanvas.height);

            logoTexture = new THREE.CanvasTexture(logoCanvas);
            logoTexture.minFilter = THREE.LinearFilter;
            logoTexture.magFilter = THREE.LinearFilter;

            if (inspectionStation) {
                const logoPlaneGeometry = new THREE.PlaneGeometry(0.6, 0.3); 
                const logoPlaneMaterial = new THREE.MeshBasicMaterial({ map: logoTexture, transparent: true });
                const logoPlane = new THREE.Mesh(logoPlaneGeometry, logoPlaneMaterial);
                
                logoPlane.position.set(0.751, 0, 0); 
                logoPlane.rotation.y = Math.PI / 2; 
                
                inspectionStation.add(logoPlane);
            }
        }

        // --- Initialize Battery Label Texture (Barcode/QR more visible) ---
        function initLabelTexture() {
            labelCanvas = document.createElement('canvas');
            const labelWidthPixels = 256; 
            const labelHeightPixels = 128;
            labelCanvas.width = labelWidthPixels;
            labelCanvas.height = labelHeightPixels;
            labelContext = labelCanvas.getContext('2d');

            labelContext.fillStyle = '#FFFFFF';
            labelContext.fillRect(0, 0, labelCanvas.width, labelCanvas.height);

            labelContext.fillStyle = '#000000';
            const barHeight = labelHeightPixels * 0.7; 
            const barY = (labelHeightPixels - barHeight) / 2;
            let currentX = labelWidthPixels * 0.1; 
            const totalBarcodeWidth = labelWidthPixels * 0.4; 
            
            let accumulatedWidth = 0;
            for (let i = 0; accumulatedWidth < totalBarcodeWidth * 0.9; i++) {
                const barWidth = Math.random() > 0.5 ? 8 : 5; 
                if(currentX + barWidth > totalBarcodeWidth) break;
                labelContext.fillRect(currentX, barY, barWidth, barHeight);
                currentX += barWidth + (Math.random() > 0.5 ? 6 : 4); 
                accumulatedWidth = currentX - (labelWidthPixels * 0.1);
            }

            const qrStartX = labelWidthPixels * 0.6; 
            const qrSize = Math.min(labelWidthPixels * 0.35, labelHeightPixels * 0.7); 
            const numQrSquares = 5; 
            const qrBoxSize = Math.floor(qrSize / (numQrSquares * 1.5)); 
            const qrPadding = (qrSize - (numQrSquares * qrBoxSize)) / (numQrSquares -1);
            const qrAreaY = (labelHeightPixels - (numQrSquares * qrBoxSize + (numQrSquares -1) * qrPadding)) / 2;

            for (let row = 0; row < numQrSquares; row++) {
                for (let col = 0; col < numQrSquares; col++) {
                    if (Math.random() > 0.45) { 
                        labelContext.fillRect(
                            qrStartX + col * (qrBoxSize + qrPadding), 
                            qrAreaY + row * (qrBoxSize + qrPadding), 
                            qrBoxSize, 
                            qrBoxSize
                        );
                    }
                }
            }
            
            labelContext.strokeStyle = '#888888'; 
            labelContext.lineWidth = 3;
            labelContext.strokeRect(0,0, labelCanvas.width, labelCanvas.height);

            labelTexture = new THREE.CanvasTexture(labelCanvas);
            labelTexture.minFilter = THREE.LinearFilter; 
            labelTexture.magFilter = THREE.LinearFilter;
        }
        
        // --- Update TV Screen Content (Increased Font Sizes) ---
        function updateTvScreen(header, batteryIdText, statusText, statusColor = 'white', reasonText = "") {
            if (!tvContext || !tvTexture) return;

            tvContext.fillStyle = '#0A0A1A'; // Dark background
            tvContext.fillRect(0, 0, tvCanvas.width, tvCanvas.height);

            // Header Text - Larger
            tvContext.fillStyle = '#00DDFF'; // Cyan header
            tvContext.font = 'bold 36px Arial'; // Was 30px
            tvContext.textAlign = 'center';
            tvContext.fillText(header, tvCanvas.width / 2, tvCanvas.height * 0.18); // Adjusted Y

            // Battery ID Text - Larger
            tvContext.fillStyle = 'white';
            tvContext.font = '28px Arial'; // Was 24px
            tvContext.fillText(batteryIdText, tvCanvas.width / 2, tvCanvas.height * 0.38); // Adjusted Y
            
            // Status Text - Larger
            tvContext.fillStyle = statusColor;
            tvContext.font = 'bold 32px Arial'; // Was 28px
            tvContext.fillText(statusText, tvCanvas.width / 2, tvCanvas.height * 0.60); // Adjusted Y
            
            // Reason Text - Larger
            if (reasonText) {
                tvContext.fillStyle = '#FFAAAA'; // Light red for reason
                tvContext.font = 'italic 24px Arial'; // Was 20px
                tvContext.fillText(reasonText, tvCanvas.width / 2, tvCanvas.height * 0.80); // Adjusted Y
            }
            
            // Border
            tvContext.strokeStyle = '#333333';
            tvContext.lineWidth = 5;
            tvContext.strokeRect(0,0, tvCanvas.width, tvCanvas.height);

            tvTexture.needsUpdate = true; 
        }


        // --- Create Conveyor System Components ---
        function createConveyorSystem() {
            const beltGeometry = new THREE.BoxGeometry(2, 0.2, 20); 
            const beltMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
            conveyorBelt = new THREE.Mesh(beltGeometry, beltMaterial);
            conveyorBelt.position.y = 0;
            conveyorBelt.castShadow = true;
            conveyorBelt.receiveShadow = true;
            scene.add(conveyorBelt);

            const stationBodyGeometry = new THREE.BoxGeometry(1.5, 1, 0.8); 
            const stationBodyMaterial = new THREE.MeshStandardMaterial({ color: 0xFFA500, metalness: 0.4, roughness: 0.5 }); 
            inspectionStation = new THREE.Mesh(stationBodyGeometry, stationBodyMaterial); 
            inspectionStation.position.set(0, 1.2, 0); 
            inspectionStation.castShadow = true;
            scene.add(inspectionStation);

            const lensGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.4, 32); 
            const lensMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.1, roughness: 0.2 }); 
            const cameraLens = new THREE.Mesh(lensGeometry, lensMaterial);
            cameraLens.rotation.x = Math.PI / 2; 
            cameraLens.position.set(0, -0.3, 0); 
            inspectionStation.add(cameraLens); 

            const scannerLightGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.4, 16); 
            const scannerLightMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0 }); 
            const scannerLight = new THREE.Mesh(scannerLightGeo, scannerLightMat);
            scannerLight.rotation.z = Math.PI / 2;
            scannerLight.position.set(0, -0.6, 0); 
            inspectionStation.add(scannerLight); 
            inspectionStation.userData.scannerLight = scannerLight;

            const ledGeometry = new THREE.SphereGeometry(0.1, 16, 8);
            const greenLedMaterial = new THREE.MeshBasicMaterial({ color: LED_OFF_COLOR });
            greenLed = new THREE.Mesh(ledGeometry, greenLedMaterial);
            greenLed.position.set(-0.3, 0.6, 0.3); 
            inspectionStation.add(greenLed);

            const redLedMaterial = new THREE.MeshBasicMaterial({ color: LED_OFF_COLOR });
            redLed = new THREE.Mesh(ledGeometry, redLedMaterial);
            redLed.position.set(0.3, 0.6, 0.3); 
            inspectionStation.add(redLed);

            const armGeometry = new THREE.BoxGeometry(0.8, 0.3, 0.3); 
            const armMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
            rejectionArm = new THREE.Mesh(armGeometry, armMaterial);
            rejectionArm.position.set(1.2, 0.25, 2.5); 
            rejectionArm.castShadow = true;
            rejectionArm.userData.originalX = rejectionArm.position.x;
            rejectionArm.userData.isRejecting = false;
            rejectionArm.userData.rejectProgress = 0; 
            scene.add(rejectionArm);

            const binWallThickness = 0.2;
            const binWidth = 3;
            const binHeight = 2;
            const binDepth = 2;
            const binMaterial = new THREE.MeshStandardMaterial({ color: 0x5a3a22 });
            const binGroup = new THREE.Group();
            const floorGeo = new THREE.BoxGeometry(binWidth, binWallThickness, binDepth);
            const floor = new THREE.Mesh(floorGeo, binMaterial);
            floor.position.y = -binHeight / 2 + binWallThickness / 2;
            floor.receiveShadow = true;
            binGroup.add(floor);
            const wallHeight = binHeight - binWallThickness;
            const sideWallGeo = new THREE.BoxGeometry(binWallThickness, wallHeight, binDepth);
            const endWallGeo = new THREE.BoxGeometry(binWidth - 2 * binWallThickness, wallHeight, binWallThickness);
            const wallPositions = [
                { x: -binWidth / 2 + binWallThickness / 2, y: 0, z: 0, type: 'side' },
                { x:  binWidth / 2 - binWallThickness / 2, y: 0, z: 0, type: 'side' },
                { x: 0, y: 0, z: -binDepth / 2 + binWallThickness / 2, type: 'end' },
            ];
            wallPositions.forEach(pos => {
                const wall = new THREE.Mesh(pos.type === 'side' ? sideWallGeo : endWallGeo, binMaterial);
                wall.position.set(pos.x, pos.y, pos.z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                binGroup.add(wall);
            });
            collectionBin = binGroup;
            collectionBin.position.set(3.5, -0.5 + binHeight/2 - binWallThickness/2, 2.5);
            scene.add(collectionBin);

            const tvScreenGeometry = new THREE.BoxGeometry(3.0, 1.8, 0.12); 
            const tvScreenMaterial = new THREE.MeshStandardMaterial({ color: 0x101010, emissive: 0x050505 }); 
            tvDisplay = new THREE.Mesh(tvScreenGeometry, tvScreenMaterial); 
            tvDisplay.castShadow = true; 
            
            const mountPoleGeometry = new THREE.CylinderGeometry(0.12, 0.12, 3.0, 16); 
            const mountPoleMaterial = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.6, roughness: 0.4 });
            tvMount = new THREE.Mesh(mountPoleGeometry, mountPoleMaterial);
            tvMount.castShadow = true;
            tvMount.position.set(-2.5, 1, -2.5); 
            
            tvDisplay.position.y = 1.5; 
            tvDisplay.rotation.y = Math.PI / 5; 
            tvMount.add(tvDisplay); 
            scene.add(tvMount);
        }

        // --- Battery Object ---
        function createBattery() {
            batteryIdCounter++;
            const batteryGeometry = new THREE.BoxGeometry(0.8, 0.2, 1.2); 
            const batteryMaterial = new THREE.MeshStandardMaterial({ color: 0xbbbbbb }); 
            const battery = new THREE.Mesh(batteryGeometry, batteryMaterial);
            battery.castShadow = true;
            battery.receiveShadow = true;
            battery.position.set(0, 0.2, -9.5 - Math.random() * 2); 
            
            const hasLabel = Math.random() > CHANCE_OF_MISSING_LABEL;
            battery.userData = {
                id: batteryIdCounter,
                status: 'uninspected', 
                inspectionProgress: 0, 
                rejectionProgress: 0, 
                fallProgress: 0,
                hasLabel: hasLabel 
            };

            if (hasLabel && labelTexture) {
                const labelPlaneGeometry = new THREE.PlaneGeometry(0.75, 0.4); 
                const labelPlaneMaterial = new THREE.MeshBasicMaterial({ map: labelTexture, transparent: false, side: THREE.DoubleSide });
                const batteryLabel = new THREE.Mesh(labelPlaneGeometry, labelPlaneMaterial);
                batteryLabel.name = "batteryLabel"; 
                
                batteryLabel.position.set(0, 0.101, 0); 
                batteryLabel.rotation.x = -Math.PI / 2; 
                
                battery.add(batteryLabel); 
            }

            batteries.push(battery);
            scene.add(battery);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            frameCount++;

            if (ledTimer > 0) {
                ledTimer--;
                if (ledTimer === 0) {
                    greenLed.material.color.set(LED_OFF_COLOR);
                    redLed.material.color.set(LED_OFF_COLOR);
                }
            }

            if (frameCount % batterySpawnInterval === 0) {
                createBattery();
            }
            
            let currentBatteryInInspectionZone = null;

            batteries.forEach((battery, index) => {
                if (battery.userData.status === 'uninspected' || battery.userData.status === 'inspecting' || battery.userData.status === 'good') {
                    battery.position.z += conveyorSpeed;
                }

                const inspectionZoneStart = -1;
                const inspectionZoneEnd = 1;

                if (battery.position.z > inspectionZoneStart && battery.position.z < inspectionZoneEnd) {
                     if(battery.userData.status === 'uninspected'){
                        battery.userData.status = 'inspecting';
                        battery.userData.inspectionProgress = 0; 
                        let inspectionMsg = "STATUS: INSPECTING...";
                        if (!battery.userData.hasLabel) {
                            inspectionMsg += " (No Label Detected)";
                        }
                        updateTvScreen("LIVE INSPECTION", `Battery ID: ${battery.userData.id}`, inspectionMsg, '#FFFF00'); 
                        if(inspectionStation.userData.scannerLight) {
                            inspectionStation.userData.scannerLight.material.opacity = 0.7;
                            inspectionStation.userData.scannerLight.material.color.setHex(0xffff00); 
                        }
                        greenLed.material.color.set(LED_OFF_COLOR);
                        redLed.material.color.set(LED_OFF_COLOR);
                        ledTimer = 0;
                     }
                     currentBatteryInInspectionZone = battery; 
                }


                if (battery.userData.status === 'inspecting') {
                    battery.userData.inspectionProgress++;
                    if (battery.userData.inspectionProgress > 60) { 
                        let isGood = true;
                        let failureReason = "";

                        if (!battery.userData.hasLabel) {
                            isGood = false;
                            failureReason = "Reason: Missing Label";
                        } else {
                            isGood = Math.random() > 0.3; 
                            if (!isGood) {
                                failureReason = "Reason: Quality Check Failed";
                            }
                        }
                        
                        battery.userData.status = isGood ? 'good' : 'bad';
                        battery.material.color.set(isGood ? 0x00dd00 : 0xdd0000); 
                        updateTvScreen("LIVE INSPECTION", `Battery ID: ${battery.userData.id}`, `STATUS: ${isGood ? 'PASS' : 'FAIL'}`, isGood ? '#00FF00' : '#FF0000', failureReason);
                        
                        if(inspectionStation.userData.scannerLight) {
                           inspectionStation.userData.scannerLight.material.opacity = 0; 
                        }

                        if (isGood) {
                            greenLed.material.color.set(LED_ON_COLOR_GREEN);
                            redLed.material.color.set(LED_OFF_COLOR);
                        } else {
                            greenLed.material.color.set(LED_OFF_COLOR);
                            redLed.material.color.set(LED_ON_COLOR_RED);
                        }
                        ledTimer = LED_DURATION; 
                    }
                }
                
                const rejectionZone = 2.5; 
                if (battery.userData.status === 'bad' && Math.abs(battery.position.z - rejectionZone) < 0.5) {
                    if (!rejectionArm.userData.isRejecting) { 
                        rejectionArm.userData.isRejecting = true;
                        rejectionArm.userData.rejectProgress = 0;
                        battery.userData.status = 'rejected'; 
                    }
                }

                if (battery.userData.status === 'rejected') {
                    if (rejectionArm.userData.isRejecting && rejectionArm.userData.rejectProgress < 1) {
                        battery.position.x = THREE.MathUtils.lerp(0, rejectionArm.userData.originalX + 0.8, rejectionArm.userData.rejectProgress);
                    } else if (rejectionArm.userData.isRejecting && rejectionArm.userData.rejectProgress >= 1){
                        battery.userData.status = 'falling';
                        battery.userData.fallProgress = 0;
                    }
                }
                
                if (battery.userData.status === 'falling') {
                    battery.userData.fallProgress += 0.05; 
                    battery.position.y -= 0.1 * battery.userData.fallProgress; 
                    battery.rotation.x += 0.1; 
                    battery.rotation.z += 0.05;

                    if (battery.position.y < -0.2) { 
                        battery.userData.status = 'collected';
                    }
                }

                if (battery.position.z > 10 && battery.userData.status === 'good') { 
                    scene.remove(battery);
                    batteries.splice(index, 1);
                } else if (battery.userData.status === 'collected' && battery.userData.fallProgress > 2) { 
                     scene.remove(battery);
                     batteries.splice(index, 1);
                }
            });
            
            if (!currentBatteryInInspectionZone && !batteries.some(b => b.userData.status === 'inspecting')) {
                 updateTvScreen("System Standby", "", "Awaiting Battery...", 'white');
            }

            if (rejectionArm.userData.isRejecting) {
                rejectionArm.userData.rejectProgress += 0.05; 
                if (rejectionArm.userData.rejectProgress <= 0.5) { 
                    rejectionArm.position.x = THREE.MathUtils.lerp(rejectionArm.userData.originalX, rejectionArm.userData.originalX + 1.2, rejectionArm.userData.rejectProgress * 2);
                } else if (rejectionArm.userData.rejectProgress <= 1) { 
                    rejectionArm.position.x = THREE.MathUtils.lerp(rejectionArm.userData.originalX + 1.2, rejectionArm.userData.originalX, (rejectionArm.userData.rejectProgress - 0.5) * 2);
                } else {
                    rejectionArm.position.x = rejectionArm.userData.originalX; 
                    rejectionArm.userData.isRejecting = false;
                    rejectionArm.userData.rejectProgress = 0;
                }
            }
            
            let isAnyBatteryInspecting = batteries.some(b => b.userData.status === 'inspecting');
            if (!isAnyBatteryInspecting && inspectionStation.userData.scannerLight && inspectionStation.userData.scannerLight.material.opacity > 0) {
                inspectionStation.userData.scannerLight.material.opacity -= 0.05; 
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Start ---
        init();

    </script>
</body>
</html>
