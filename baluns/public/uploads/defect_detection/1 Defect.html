<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Industrial Animation - Flipper Rejection with Logo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Inter', sans-serif; color: #fff; }
        canvas { display: block; width: 100%; height: 100%; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px; 
            text-align: left;
            font-size: 16px;
            z-index: 100;
        }
        #displayCanvas { display: none; }

        .button-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px; /* Space between buttons */
            z-index: 101;
        }

        .action-button {
            padding: 8px 15px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-align: center;
        }
        #aiReportButton {
            background-color: #007bff;
        }
        #aiReportButton:hover {
            background-color: #0056b3;
        }
        #processImprovementButton {
            background-color: #28a745; /* Green for improvement */
        }
        #processImprovementButton:hover {
            background-color: #1e7e34;
        }
        .action-button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); 
            padding-top: 60px;
        }
        .modal-content {
            background-color: #282c34; margin: 5% auto; padding: 25px; border: 1px solid #555;
            width: 80%; max-width: 500px; border-radius: 8px; color: #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 10px; border-bottom: 1px solid #444;
            font-size: 1.5em; margin-bottom: 15px;
        }
        #modalTitle { }
        .modal-body { font-size: 1.1em; line-height: 1.6; min-height: 50px; }
        .close-button { color: #aaa; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: #fff; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="info">Industrial Animation: AI Analysis - Flipper Rejection</div>
    <div class="button-panel">
        <button id="aiReportButton" class="action-button" disabled>✨ Generate Defect Report</button>
        <button id="processImprovementButton" class="action-button" disabled>✨ Suggest Process Improvement</button>
    </div>
    <canvas id="displayCanvas" width="256" height="192"></canvas> 

    <div id="aiReportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">AI Analysis</span> 
                <span class="close-button" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="aiReportText">
                Please inspect an item first.
            </div>
        </div>
    </div>

    <script>
        // --- Three.js Global variables ---
        let scene, camera, renderer, controls;
        let conveyorBelt, movingObjects = [];
        let industrialCamera, cameraGantry, scannerLight, controlPanel, panelScreenTexture, displayCanvas, displayCtx; 
        let rejectionBin; 
        let logoMesh; 

        // --- Flipper Variables ---
        let flipperPivot, flipperPaddle;
        let flipperState = 'idle'; 
        const FLIPPER_ROTATION_SPEED = 0.18; 
        const FLIPPER_IDLE_ROTATION_Z = Math.PI / 15; 
        const FLIPPER_ACTIVE_ROTATION_Z = -Math.PI / 2.3; 
        let itemToFlip = null; 
        const FLIPPER_GRAVITY = 0.003; 

        // --- Animation Constants ---
        const conveyorSpeed = 0.025; const conveyorLength = 8; const conveyorWidth = 1.0; 
        const objectSpawnInterval = 750; let lastSpawnTime = 0;
        const inspectionPointZ = 0; const rejectionPointZ = inspectionPointZ + 0.5; 
        const defectiveRate = 0.30; 
        
        // --- AI Feature Variables ---
        let lastDefectiveItemData = null; 
        let rejectedItemCount = 0; 
        const REJECTIONS_FOR_IMPROVEMENT_SUGGESTION = 3; 
        const aiReportButton = document.getElementById('aiReportButton');
        const processImprovementButton = document.getElementById('processImprovementButton'); 
        const aiReportModal = document.getElementById('aiReportModal');
        const aiReportText = document.getElementById('aiReportText');
        const modalTitleElement = document.getElementById('modalTitle'); 

        // --- Material Definitions ---
        const basePlatformMaterial = new THREE.MeshStandardMaterial({ color: 0xCCCCCC, roughness: 0.7, metalness: 0.3 });
        const conveyorSupportMaterial = new THREE.MeshStandardMaterial({ color: 0xFF8C00, roughness: 0.6 });
        const conveyorBeltMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const itemMaterialBlue = new THREE.MeshStandardMaterial({ color: 0x3377FF, roughness: 0.4, metalness: 0.2 });
        const itemMaterialRed = new THREE.MeshStandardMaterial({ color: 0xFF3333, roughness: 0.4, metalness: 0.2 });
        const armMaterial = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.5, metalness: 0.4 }); 
        const gantryMaterial = new THREE.MeshStandardMaterial({ color: 0x656565, roughness: 0.6, metalness: 0.5 }); 
        const cameraBodyMaterial = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.3, metalness: 0.6 });
        const cameraLensMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.1 });
        const panelScreenMaterial = new THREE.MeshStandardMaterial({ emissive: 0x0A0A15, roughness: 0.2, map: null }); 
        const flipperMaterial = new THREE.MeshStandardMaterial({ color: 0x606065, metalness: 0.7, roughness: 0.4 }); 
        const binMaterial = new THREE.MeshStandardMaterial({ color: 0x424242, roughness: 0.7, metalness: 0.2 }); 
        const binRimMaterial = new THREE.MeshStandardMaterial({ color: 0xFFD700 }); 


        // --- Initialization ---
        function init() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3.0, 3.5, 6); camera.lookAt(0, 0.2, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.minDistance = 2; controls.maxDistance = 25; controls.maxPolarAngle = Math.PI / 1.9;
            scene.add(new THREE.AmbientLight(0xffffff, 0.45));
            const spotLight = new THREE.SpotLight(0xffffff, 0.9, 25, Math.PI / 5, 0.4, 1.5);
            spotLight.position.set(1, 7, 2); spotLight.castShadow = true; spotLight.shadow.mapSize.width = 1024; spotLight.shadow.mapSize.height = 1024;
            scene.add(spotLight);
            const platformGeometry = new THREE.BoxGeometry(conveyorLength * 1.1, 0.2, conveyorWidth * 2.5); 
            const basePlatform = new THREE.Mesh(platformGeometry, basePlatformMaterial);
            basePlatform.position.y = -0.6; basePlatform.receiveShadow = true; scene.add(basePlatform);
            displayCanvas = document.getElementById('displayCanvas'); displayCtx = displayCanvas.getContext('2d');
            panelScreenTexture = new THREE.CanvasTexture(displayCanvas);
            panelScreenMaterial.map = panelScreenTexture; panelScreenMaterial.emissiveMap = panelScreenTexture; 
            updateDisplayCanvas("STANDBY", null); 
            createConveyorBeltAndSupports(); industrialCamera = createIndustrialCameraComponents(); 
            createCameraGantry(industrialCamera); createControlPanel(); 
            createFlipperMechanism(); 
            createRejectionBin(); 
            createLogo(); 
            window.addEventListener('resize', onWindowResize, false);
            aiReportButton.addEventListener('click', handleGenerateDefectReportClick); 
            processImprovementButton.addEventListener('click', handleProcessImprovementClick); 
        }

        // --- Component Creation Functions ---
        function createConveyorBeltAndSupports() { /* ... (no changes) ... */ 
            const beltGroup = new THREE.Group(); 
            const beltSurfaceGeometry = new THREE.BoxGeometry(conveyorWidth, 0.1, conveyorLength);
            conveyorBelt = new THREE.Mesh(beltSurfaceGeometry, conveyorBeltMaterial);
            conveyorBelt.castShadow = true; conveyorBelt.receiveShadow = true; beltGroup.add(conveyorBelt);
            const supportHeight = 0.4; const supportSize = 0.5; const numSupportsPerSide = 3;
            for (let i = 0; i < numSupportsPerSide; i++) {
                const supportGeometry = new THREE.BoxGeometry(supportSize, supportHeight, supportSize);
                const supportLeft = new THREE.Mesh(supportGeometry, conveyorSupportMaterial);
                supportLeft.castShadow = true; supportLeft.receiveShadow = true; 
                supportLeft.position.set( -conveyorWidth / 2 - supportSize / 2 + 0.15, -supportHeight / 2 - 0.05, (i - (numSupportsPerSide -1)/2) * (conveyorLength / (numSupportsPerSide)));
                beltGroup.add(supportLeft);
                const supportRight = new THREE.Mesh(supportGeometry, conveyorSupportMaterial);
                supportRight.castShadow = true; supportRight.receiveShadow = true; 
                supportRight.position.set( conveyorWidth / 2 + supportSize / 2 - 0.15, -supportHeight / 2 - 0.05, (i - (numSupportsPerSide -1)/2) * (conveyorLength / (numSupportsPerSide)));
                beltGroup.add(supportRight);
            }
            const rollerRadius = 0.1; const rollerGeo = new THREE.CylinderGeometry(rollerRadius, rollerRadius, conveyorWidth, 12); 
            const rollerMat = new THREE.MeshStandardMaterial({color: 0x444444});
            const roller1 = new THREE.Mesh(rollerGeo, rollerMat);
            roller1.rotation.z = Math.PI/2; roller1.position.set(0, -rollerRadius -0.05, conveyorLength/2 - rollerRadius);
            beltGroup.add(roller1);
            const roller2 = new THREE.Mesh(rollerGeo, rollerMat);
            roller2.rotation.z = Math.PI/2; roller2.position.set(0, -rollerRadius -0.05, -conveyorLength/2 + rollerRadius);
            beltGroup.add(roller2);
            beltGroup.position.y = 0; scene.add(beltGroup);
        }
        function createIndustrialCameraComponents() { /* ... (no changes) ... */ 
            const camGroup = new THREE.Group(); 
            const cameraBodyGeo = new THREE.BoxGeometry(0.3, 0.25, 0.4);
            const camBody = new THREE.Mesh(cameraBodyGeo, cameraBodyMaterial);
            camBody.castShadow = true; camGroup.add(camBody); 
            const lensGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.15, 16); 
            const camLens = new THREE.Mesh(lensGeo, cameraLensMaterial);
            camLens.rotation.x = Math.PI / 2; camLens.position.z = 0.2 + 0.15/2; 
            camBody.add(camLens); 
            scannerLight = new THREE.SpotLight(0x00ff00, 0, 2, Math.PI / 9, 1, 0); 
            scannerLight.castShadow = false; scannerLight.position.set(0, -0.15, 0.1); 
            scannerLight.target.position.set(0, -1, 0.1); 
            camBody.add(scannerLight); camBody.add(scannerLight.target); 
            const lightGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.05, 8);
            const redLightMat = new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0x000000}); 
            const greenLightMat = new THREE.MeshStandardMaterial({color: 0x00ff00, emissive: 0x000000});
            const redLight = new THREE.Mesh(lightGeo, redLightMat);
            redLight.position.set(-0.07, 0.15, 0.1); camBody.add(redLight);
            const greenLight = new THREE.Mesh(lightGeo, greenLightMat);
            greenLight.position.set(0.07, 0.15, 0.1); camBody.add(greenLight);
            return camGroup; 
        }
        function createCameraGantry(cameraToMount) { /* ... (no changes) ... */ 
            cameraGantry = new THREE.Group(); 
            const postHeight = 1.3; const postSize = 0.1; const postGeo = new THREE.BoxGeometry(postSize, postHeight, postSize);
            const post1 = new THREE.Mesh(postGeo, gantryMaterial);
            post1.castShadow = true; post1.position.set(-conveyorWidth / 2 - 0.2, postHeight / 2 - 0.5, inspectionPointZ); 
            cameraGantry.add(post1);
            const post2 = new THREE.Mesh(postGeo, gantryMaterial);
            post2.castShadow = true; post2.position.set(conveyorWidth / 2 + 0.2, postHeight / 2 - 0.5, inspectionPointZ);
            cameraGantry.add(post2);
            const beamLength = conveyorWidth + 0.4 + postSize * 2; 
            const beamGeo = new THREE.BoxGeometry(beamLength, postSize * 1.5, postSize * 1.5);
            const beam = new THREE.Mesh(beamGeo, gantryMaterial);
            beam.castShadow = true; beam.position.set(0, postHeight - (postSize * 1.5)/2 - 0.5, inspectionPointZ); 
            cameraGantry.add(beam);
            if (cameraToMount) {
                beam.add(cameraToMount); 
                cameraToMount.position.set(0, -(postSize*1.5)/2 - cameraToMount.children[0].geometry.parameters.height/2 - 0.05, 0);
                cameraToMount.rotation.set(0, 0, 0); 
            }
            scene.add(cameraGantry);
        }
        function createControlPanel() { /* ... (no changes) ... */ 
            controlPanel = new THREE.Group(); 
            const panelBoxGeo = new THREE.BoxGeometry(0.7, 0.8, 0.2); 
            const panelBox = new THREE.Mesh(panelBoxGeo, armMaterial); 
            panelBox.castShadow = true; controlPanel.add(panelBox);
            const screenGeo = new THREE.PlaneGeometry(0.55, 0.45); 
            const screen = new THREE.Mesh(screenGeo, panelScreenMaterial);
            screen.position.set(0, 0.12, 0.105); controlPanel.add(screen);
            const standGeo = new THREE.BoxGeometry(0.7,0.1,0.3); 
            const stand = new THREE.Mesh(standGeo, basePlatformMaterial);
            stand.position.y = -0.8/2 - 0.1/2; controlPanel.add(stand);
            controlPanel.position.set(conveyorWidth / 2 + 0.8, -0.5 + 0.8/2, inspectionPointZ + 1.0); 
            scene.add(controlPanel);
        }
        function createFlipperMechanism() { /* ... (no changes) ... */ 
            flipperPivot = new THREE.Group(); 
            const paddleLength = conveyorWidth * 0.7; 
            const paddleThickness = 0.05;          
            const paddleWidth = 0.6; 
            const paddleGeo = new THREE.BoxGeometry(paddleLength, paddleThickness, paddleWidth);
            flipperPaddle = new THREE.Mesh(paddleGeo, flipperMaterial);
            flipperPaddle.castShadow = true;
            flipperPaddle.position.set(-paddleLength / 2, 0, 0); 
            flipperPivot.add(flipperPaddle);
            flipperPivot.position.set(
                conveyorWidth / 2,      
                0.15,                   
                rejectionPointZ         
            );
            flipperPivot.rotation.z = FLIPPER_IDLE_ROTATION_Z; 
            scene.add(flipperPivot);
        }
        function createRejectionBin() { /* ... (no changes) ... */ 
            const binWidth = conveyorWidth * 1.2; 
            const binHeight = 0.8; const binDepth = 1.0;
            rejectionBin = new THREE.Group(); 
            const wallThickness = 0.05;
            const floorGeo = new THREE.BoxGeometry(binWidth, wallThickness, binDepth);
            const floor = new THREE.Mesh(floorGeo, binMaterial);
            floor.position.y = -binHeight / 2 + wallThickness / 2; floor.receiveShadow = true;
            rejectionBin.add(floor);
            const sideWallGeo = new THREE.BoxGeometry(wallThickness, binHeight - wallThickness, binDepth); 
            const endWallGeo = new THREE.BoxGeometry(binWidth - wallThickness*2, binHeight - wallThickness, wallThickness); 
            const wallData = [
                { x: -binWidth/2 + wallThickness/2, y: 0, z: 0, geo: sideWallGeo }, 
                { x:  binWidth/2 - wallThickness/2, y: 0, z: 0, geo: sideWallGeo }, 
                { x: 0, y: 0, z: -binDepth/2 + wallThickness/2, geo: endWallGeo },  
                { x: 0, y: 0, z:  binDepth/2 - wallThickness/2, geo: endWallGeo }   
            ];
            wallData.forEach(data => {
                if (data.geo === endWallGeo && data.z > 0 && true) return; 
                const wall = new THREE.Mesh(data.geo, binMaterial);
                wall.position.set(data.x, data.y, data.z); 
                wall.castShadow = true; wall.receiveShadow = true;
                rejectionBin.add(wall);
            });
            const rimHeight = 0.06; const topRimThickness = 0.05;
            const rimSegmentLengthX = binWidth; const rimSegmentLengthZ = binDepth - topRimThickness * 2; 
            const rimFrontGeo = new THREE.BoxGeometry(rimSegmentLengthX, rimHeight, topRimThickness);
            const rimBackGeo = new THREE.BoxGeometry(rimSegmentLengthX, rimHeight, topRimThickness);
            const rimSideGeo = new THREE.BoxGeometry(topRimThickness, rimHeight, rimSegmentLengthZ);
            const rimSegments = [
                {mesh: new THREE.Mesh(rimFrontGeo, binRimMaterial), x:0, y: binHeight/2 - rimHeight/2, z: binDepth/2 - topRimThickness/2}, 
                {mesh: new THREE.Mesh(rimBackGeo, binRimMaterial), x:0, y: binHeight/2 - rimHeight/2, z: -binDepth/2 + topRimThickness/2}, 
                {mesh: new THREE.Mesh(rimSideGeo, binRimMaterial), x:binWidth/2 - topRimThickness/2, y: binHeight/2 - rimHeight/2, z: 0}, 
                {mesh: new THREE.Mesh(rimSideGeo, binRimMaterial), x:-binWidth/2 + topRimThickness/2, y: binHeight/2 - rimHeight/2, z: 0}  
            ];
            rimSegments.forEach(seg => {
                seg.mesh.position.set(seg.x, seg.y, seg.z);
                seg.mesh.castShadow = true; rejectionBin.add(seg.mesh);
            });
            rejectionBin.position.set(conveyorWidth * 0.9 + (1.0 - conveyorWidth)*0.5, -0.5, rejectionPointZ + binDepth/2); 
            scene.add(rejectionBin);
        }
        
        // MODIFIED: createLogo function with improved error handling and structure
        function createLogo() {
            const textureLoader = new THREE.TextureLoader();

            // Define initial geometry and material for the logo mesh
            // This allows the mesh to be added to the scene graph before the texture loads.
            const initialLogoWidth = 0.6; // A default width
            const initialLogoHeight = 0.25; // A default height, will be adjusted by aspect ratio
            const logoGeometry = new THREE.PlaneGeometry(initialLogoWidth, initialLogoHeight);
            const logoMaterial = new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0, // Start fully transparent
                side: THREE.DoubleSide
            });
            logoMesh = new THREE.Mesh(logoGeometry, logoMaterial);
            logoMesh.visible = false; // Start invisible, make visible on successful load

            // Attempt to parent the logo mesh to the control panel
            if (controlPanel) {
                const panelBox = controlPanel.children.find(child => child.geometry instanceof THREE.BoxGeometry && child.material === armMaterial);
                if (panelBox) {
                    logoMesh.position.set(
                        panelBox.geometry.parameters.width / 2 + 0.015, // Slightly off the surface
                        0.1, // Position it a bit higher on the panel side
                        0  // Centered in depth on the panel box side
                    );
                    logoMesh.rotation.y = Math.PI / 2; // Rotate to face outwards
                    panelBox.add(logoMesh);
                } else {
                     console.warn("Control panel box not found for logo placement. Logo will be added to scene origin if texture loads.");
                     // Don't add to scene yet, only if texture loads and panelBox is still not found
                }
            } else {
                console.warn("Control panel not found for logo placement. Logo will be added to scene origin if texture loads.");
            }

            textureLoader.load(
                'logo.png', // The path to your logo image
                function (texture) { // onLoad callback
                    // Calculate aspect ratio and update geometry/scale
                    const logoAspect = texture.image.width / texture.image.height;
                    const desiredLogoHeight = 0.25; 
                    const desiredLogoWidth = desiredLogoHeight * logoAspect;

                    // Dispose old geometry and create new one with correct aspect ratio
                    if (logoMesh.geometry) {
                        logoMesh.geometry.dispose();
                    }
                    logoMesh.geometry = new THREE.PlaneGeometry(desiredLogoWidth, desiredLogoHeight);
                    
                    logoMesh.material.map = texture;
                    logoMesh.material.opacity = 1.0; // Make it fully opaque
                    logoMesh.material.needsUpdate = true;
                    logoMesh.visible = true; // Make the logo visible

                    // If logoMesh was not parented earlier due to controlPanel/panelBox not being ready, try adding to scene as fallback
                    if (!logoMesh.parent && !controlPanel) { // Check if it's still not parented
                        console.log("Logo parented to scene origin as fallback.");
                        scene.add(logoMesh);
                        logoMesh.position.set(1.5, 0.5, 1.5); // Example fallback position
                    }
                    console.log("Logo texture loaded and applied successfully.");
                },
                undefined, // onProgress callback (not used here)
                function (errorEvent) { // onError callback
                    console.error('Error loading logo texture from path "logo.png". The logo will not be displayed. Please ensure "logo.png" is accessible in the same directory as the HTML file or provide a correct path. ErrorEvent:', errorEvent);
                    if (logoMesh) {
                        logoMesh.visible = false; // Ensure it remains invisible on error
                    }
                }
            );
        }

        // --- Display & Spawning Functions ---
        function updateDisplayCanvas(status, item) { /* ... (no changes) ... */ 
            displayCtx.fillStyle = '#0A0F14'; 
            displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
            displayCtx.font = 'bold 28px Arial'; 
            displayCtx.textAlign = 'center';
            if (status === "INSPECTING" && item) {
                const itemIsRed = item.material.color.getHexString() === itemMaterialRed.color.getHexString();
                displayCtx.fillStyle = itemIsRed ? '#FF3333' : '#3377FF'; 
                const cx = displayCanvas.width / 2; const cy = displayCanvas.height / 2;
                const itemWidth = 60; const itemHeight = 110; 
                displayCtx.fillRect(cx - itemWidth/2, cy - itemHeight/2, itemWidth, itemHeight);
                displayCtx.strokeStyle = '#FFFFFF'; displayCtx.lineWidth = 3; 
                displayCtx.strokeRect(cx - itemWidth/2, cy - itemHeight/2, itemWidth, itemHeight);
                displayCtx.fillStyle = '#FFFFFF';
                displayCtx.fillText(itemIsRed ? "DEFECTIVE" : "OK", cx, cy + 70); 
            } else { 
                displayCtx.fillStyle = '#60B0D0'; 
                displayCtx.fillText(status, displayCanvas.width / 2, displayCanvas.height / 2);
            }
            panelScreenTexture.needsUpdate = true; 
        }
        function spawnObject() { /* ... (no changes) ... */ 
            const objectRadius = 0.15; const objectHeight = 0.5;
            const geometry = new THREE.CylinderGeometry(objectRadius, objectRadius, objectHeight, 16);
            const isSpawnDefective = Math.random() < defectiveRate;
            const material = isSpawnDefective ? itemMaterialRed.clone() : itemMaterialBlue.clone();
            const itemColorString = isSpawnDefective ? "Red" : "Blue";
            const object = new THREE.Mesh(geometry, material);
            object.rotation.x = Math.PI / 2; 
            object.position.set( 0, objectRadius, -conveyorLength / 2 + objectHeight / 2);
            object.castShadow = true; object.receiveShadow = true;
            object.userData = {
                isDefective: isSpawnDefective, 
                isInspected: false, isBeingRejected: false, isPushed: false, 
                originalMaterial: material, 
                itemType: "Cylindrical Component", 
                itemColor: itemColorString,
                velocity: new THREE.Vector3() 
            };
            scene.add(object); movingObjects.push(object); 
        }
        
        // --- AI Modal & API Call Functions ---
        function openModal() { aiReportModal.style.display = "block"; }
        function closeModal() { aiReportModal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == aiReportModal) { closeModal(); } }
        async function callGeminiAPI(prompt) { /* ... (no changes) ... */ 
            let chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
            const payload = { contents: chatHistory };
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                const errorData = await response.json();
                console.error("Gemini API Error:", errorData);
                throw new Error(`API request failed with status ${response.status}: ${errorData.error?.message || 'Unknown error'}`);
            }
            const result = await response.json();
            if (result.candidates && result.candidates.length > 0 &&
                result.candidates[0].content && result.candidates[0].content.parts &&
                result.candidates[0].content.parts.length > 0) {
                return result.candidates[0].content.parts[0].text;
            } else {
                console.error("Unexpected API response structure:", result);
                throw new Error("Could not retrieve a valid response from AI (unexpected structure).");
            }
        }
        async function handleGenerateDefectReportClick() { /* ... (no changes) ... */ 
            if (!lastDefectiveItemData) {
                modalTitleElement.textContent = "Defect Report Status";
                aiReportText.textContent = "No defective item has been processed recently. Please wait for a rejection.";
                openModal(); return;
            }
            modalTitleElement.textContent = "AI Defect Analysis Report";
            aiReportText.textContent = "Generating AI Defect Report... Please wait.";
            openModal();
            aiReportButton.disabled = true; 
            const prompt = `An industrial inspection system rejected a ${lastDefectiveItemData.itemColor.toLowerCase()} ${lastDefectiveItemData.itemType.toLowerCase()}. 
            Provide a brief, plausible technical reason for this rejection, suitable for a quality control report.
            Focus on potential manufacturing defects. Limit response to 2-3 sentences.`;
            try {
                const report = await callGeminiAPI(prompt);
                aiReportText.textContent = report;
            } catch (error) {
                aiReportText.textContent = `Error generating defect report: ${error.message}`;
            } 
        }
        async function handleProcessImprovementClick() { /* ... (no changes) ... */ 
            modalTitleElement.textContent = "AI Process Improvement Suggestion";
            aiReportText.textContent = "Generating improvement suggestion... Please wait.";
            openModal();
            processImprovementButton.disabled = true;
            const prompt = `An industrial line producing cylindrical components has experienced ${rejectedItemCount} rejections due to various defects. 
            Suggest one general area of the manufacturing or quality control process to investigate for potential improvements to reduce overall defect rates. 
            Provide a concise, actionable suggestion (1-2 sentences).`;
            try {
                const suggestion = await callGeminiAPI(prompt);
                aiReportText.textContent = suggestion;
            } catch (error) {
                aiReportText.textContent = `Error generating suggestion: ${error.message}`;
            } finally {
                 setTimeout(() => { processImprovementButton.disabled = false; }, 5000); 
            }
        }

        // --- Animation Loop ---
        let scannerActiveTime = 0; const scannerDuration = 200; 
        function animate(currentTime) {
            requestAnimationFrame(animate); const now = currentTime || 0; 
            if (now - lastSpawnTime > objectSpawnInterval) { spawnObject(); lastSpawnTime = now; }
            
            // Camera LED logic (no changes)
            if (industrialCamera && industrialCamera.children.length > 0) {
                const camBody = industrialCamera.children[0]; 
                if (camBody && camBody.children.length > 0) { 
                    const redLightMesh = camBody.children.find(c => c.material && c.material.color.getHex() === 0xff0000);
                    const greenLightMesh = camBody.children.find(c => c.material && c.material.color.getHex() === 0x00ff00);
                    if (scannerLight.intensity > 0) { 
                        if (scannerLight.color.getHex() === 0xff0000) { 
                            if(redLightMesh) redLightMesh.material.emissive.setHex(0xff0000); 
                            if(greenLightMesh) greenLightMesh.material.emissive.setHex(0x000000); 
                        } else { 
                            if(redLightMesh) redLightMesh.material.emissive.setHex(0x000000); 
                            if(greenLightMesh) greenLightMesh.material.emissive.setHex(0x00ff00); 
                        }
                    } else { 
                        if(redLightMesh) redLightMesh.material.emissive.setHex(0x000000); 
                        if(greenLightMesh) greenLightMesh.material.emissive.setHex(0x000000); 
                        if(displayCtx && ( (currentTime - scannerActiveTime > scannerDuration + 50) || scannerActiveTime === 0) ) { 
                            updateDisplayCanvas("STANDBY", null); 
                        }
                    }
                }
            }
            if (scannerLight.intensity > 0 && now - scannerActiveTime > scannerDuration) { scannerLight.intensity = 0; }

            // Flipper animation logic (no changes)
            if (flipperState === 'activating') {
                flipperPivot.rotation.z -= FLIPPER_ROTATION_SPEED; 
                if (flipperPivot.rotation.z <= FLIPPER_ACTIVE_ROTATION_Z) {
                    flipperPivot.rotation.z = FLIPPER_ACTIVE_ROTATION_Z;
                    flipperState = 'returning';
                    if (itemToFlip && !itemToFlip.userData.isPushed) {
                        itemToFlip.userData.isPushed = true;
                        const pushStrengthX = 0.06 + Math.random() * 0.03; 
                        const liftStrengthY = 0.05 + Math.random() * 0.02; 
                        itemToFlip.userData.velocity.set(pushStrengthX, liftStrengthY, (Math.random() - 0.5) * 0.02); 
                        itemToFlip = null; 
                    }
                }
            } else if (flipperState === 'returning') {
                flipperPivot.rotation.z += FLIPPER_ROTATION_SPEED * 0.8; 
                if (flipperPivot.rotation.z >= FLIPPER_IDLE_ROTATION_Z) {
                    flipperPivot.rotation.z = FLIPPER_IDLE_ROTATION_Z;
                    flipperState = 'idle';
                }
            }

            // Process moving objects (no changes)
            for (let i = movingObjects.length - 1; i >= 0; i--) {
                const obj = movingObjects[i]; const objectActualHeight = obj.geometry.parameters.height;
                if (obj.userData.isPushed) { 
                    obj.position.add(obj.userData.velocity);
                    obj.userData.velocity.y -= FLIPPER_GRAVITY; 
                    obj.rotation.x += obj.userData.velocity.x * 0.5; 
                    obj.rotation.z += obj.userData.velocity.y * 0.5;
                    const binX = rejectionBin.position.x; const binZ = rejectionBin.position.z;
                    const binWidthHalf = (conveyorWidth * 1.2) / 2; const binDepthHalf = 1.0 / 2;
                    if (obj.position.y < -0.5 && 
                        obj.position.x > binX - binWidthHalf && obj.position.x < binX + binWidthHalf &&
                        obj.position.z > binZ - binDepthHalf && obj.position.z < binZ + binDepthHalf) {
                        scene.remove(obj); obj.geometry.dispose(); obj.material.dispose();
                        movingObjects.splice(i, 1); 
                        rejectedItemCount++; 
                        if (rejectedItemCount >= REJECTIONS_FOR_IMPROVEMENT_SUGGESTION) {
                            processImprovementButton.disabled = false; 
                        }
                        continue; 
                    } else if (obj.position.y < -2) { 
                         scene.remove(obj); obj.geometry.dispose(); obj.material.dispose(); movingObjects.splice(i,1); continue;
                    }
                } else if (obj.userData.isBeingRejected) { 
                     obj.position.z += conveyorSpeed; 
                } else { 
                    obj.position.z += conveyorSpeed; 
                }
                if (!obj.userData.isInspected && Math.abs(obj.position.z - inspectionPointZ) < (objectActualHeight / 2 * 0.8) ) {
                    obj.userData.isInspected = true; 
                    scannerLight.intensity = 1.8; 
                    scannerLight.color.set(obj.userData.isDefective ? 0xff0000 : 0x00dd00); 
                    scannerActiveTime = now; 
                    updateDisplayCanvas("INSPECTING", obj); 
                    if (obj.userData.isDefective) {
                        obj.userData.itemColor = "Red"; 
                        lastDefectiveItemData = { id: obj.uuid, itemType: obj.userData.itemType, itemColor: "Red" };
                        aiReportButton.disabled = false; 
                    }
                }
                if (obj.userData.isDefective && obj.userData.isInspected && !obj.userData.isBeingRejected &&
                    Math.abs(obj.position.z - rejectionPointZ) < (objectActualHeight * 0.6)) { 
                    obj.userData.isBeingRejected = true; 
                    if (flipperState === 'idle') { 
                        flipperState = 'activating';
                        itemToFlip = obj; 
                    }
                }
                if (!obj.userData.isBeingRejected && obj.position.z > conveyorLength / 2 + objectActualHeight) {
                    scene.remove(obj); obj.geometry.dispose(); obj.material.dispose(); movingObjects.splice(i, 1);
                }
            }
            controls.update(); renderer.render(scene, camera); 
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
            if (displayCtx) updateDisplayCanvas("STANDBY", null); 
        }
        window.onload = function () { init(); animate(); };
    </script>
</body>
</html>
